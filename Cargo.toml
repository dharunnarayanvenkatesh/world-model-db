[workspace]
resolver = "2"
members = [
    "crates/wm-core",
    "crates/wm-catalog",
    "crates/wm-temporal",
    "crates/wm-storage",
    "crates/wm-ontology",
    "crates/wm-resolution",
    "crates/wm-graph",
    "crates/wm-query",
    "crates/wm-agent",
    "crates/wm-ingest",
    "crates/wm-server",
    "crates/wm-cli",
    "crates/wm-bench",
]
exclude = ["external/datafusion", "external/redb"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/worldmodel-db/worldmodel-db"

[profile.release]
lto = "thin"
strip = true
